name: Auto Public and Live Link Generator

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # প্রজেক্টটি প্রাইভেট থাকলে GitHub Actions-এর নিজস্ব পারমিশন দিয়ে সেটিকে স্বয়ংক্রিয়ভাবে Public করে দেওয়া
      - name: Make Repository Public Automatically
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo edit "${{ github.repository }}" --visibility public || true
        shell: bash

      - name: Setup GitHub Pages Environment
        uses: actions/configure-pages@v4

      - name: Package Project Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publish to Live URL
        id: deployment
        uses: actions/deploy-pages@v4

  output-link:
    needs: deploy-live
    runs-on: ubuntu-latest
    steps:
      - name: Show Live URL
        run: |
          echo "=================================================="
          echo "🎉 প্রজেক্ট সফলভাবে পাবলিক ও লাইভ হয়ে গেছে!"
          echo "🔗 লাইভ লিংক: ${{ steps.deployment.outputs.page_url }}"
          echo "=================================================="
