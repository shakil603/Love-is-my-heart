name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the APK
        id: apk_build
        continue-on-error: true
        working-directory: android
        env:
          # Repository variable overrides this. The fallback points at the live
          # preview for this workspace; people can change it inside the app.
          LIMH_APP_URL: ${{ vars.LIMH_APP_URL || 'https://3000-iz2yolkv1s9ntthajp4bc.e2b.app' }}
        run: |
          {
            echo "### Environment"
            java -version
            gradle -version
            echo "ANDROID_HOME=$ANDROID_HOME"
            ls "$ANDROID_HOME/platforms" || true
            ls "$ANDROID_HOME/build-tools" || true
            echo "### Build"
          } > ../android-build.log 2>&1
          gradle assembleDebug --no-daemon --stacktrace >> ../android-build.log 2>&1
          status=$?
          tail -80 ../android-build.log
          ls -lh app/build/outputs/apk/debug/ || true
          exit $status

      - name: Publish the failure log
        if: steps.apk_build.outcome == 'failure'
        run: |
          mkdir -p public/downloads
          cp android-build.log public/downloads/android-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/android-build.log
          git commit -m "Record Android build failure [skip ci]" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true

      - name: Stop when the build failed
        if: steps.apk_build.outcome == 'failure'
        run: exit 1

      - name: Copy the APK into the web app
        run: |
          mkdir -p public/downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk public/downloads/love-is-my-heart.apk
          sha256sum public/downloads/love-is-my-heart.apk | tee public/downloads/love-is-my-heart.apk.sha256
          ls -lh public/downloads/

      - name: Keep a workflow artifact too
        uses: actions/upload-artifact@v4
        with:
          name: love-is-my-heart-apk
          path: |
            public/downloads/love-is-my-heart.apk
            public/downloads/love-is-my-heart.apk.sha256
          if-no-files-found: error

      - name: Commit the APK back to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/love-is-my-heart.apk public/downloads/love-is-my-heart.apk.sha256
          if git diff --cached --quiet; then
            echo "APK unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "Build Love Is My Heart Android APK [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
