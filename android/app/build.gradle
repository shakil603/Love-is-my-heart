plugins {
    id 'com.android.application'
}

def limhUrl = (System.getenv('LIMH_APP_URL') ?: project.findProperty('LIMH_APP_URL') ?: '').toString()

android {
    namespace 'app.limh'
    compileSdk 35

    defaultConfig {
        applicationId 'app.limh'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
        // Optional address pre-filled in the server setup screen. The app opens
        // its bundled offline demo on first launch, so no URL is required.
        buildConfigField 'String', 'DEFAULT_URL', '"' + limhUrl.replace('\\', '\\\\').replace('"', '\\"') + '"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
