plugins {
    id 'com.android.application'
}

def limhUrl = (System.getenv('LIMH_APP_URL') ?: project.findProperty('LIMH_APP_URL') ?: '').toString()

android {
    namespace 'app.limh'
    compileSdk 35

    defaultConfig {
        applicationId 'app.limh'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '1.3.0'
        // Optional address pre-filled in the server setup screen. The app opens
        // its bundled offline demo on first launch, so no URL is required.
        buildConfigField 'String', 'DEFAULT_URL', '"' + limhUrl.replace('\\', '\\\\').replace('"', '\\"') + '"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // Align the Kotlin stdlib that AndroidX Activity and SplashScreen pull in.
    // Without this the older kotlin-stdlib-jdk8 duplicates classes from the
    // newer kotlin-stdlib and checkDebugDuplicateClasses fails.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')

    // Open-source AndroidX helper for serving bundled web assets over a
    // same-origin https:// URL inside the WebView.
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.activity:activity:1.9.3'
}
