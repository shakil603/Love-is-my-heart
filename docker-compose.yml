services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: limh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-limh-local-password}
      POSTGRES_DB: limh
    volumes:
      - limh-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U limh -d limh"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://limh:${POSTGRES_PASSWORD:-limh-local-password}@db:5432/limh
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in your .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      LIMH_DEMO_MODE: ${LIMH_DEMO_MODE:-1}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - limh-uploads:/app/public/uploads

volumes:
  limh-db:
  limh-uploads:
